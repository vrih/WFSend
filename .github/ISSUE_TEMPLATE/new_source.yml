name: Suggest a document or data set
description: A published report, committee paper, FOI response or data set the site should include.
labels: [new source]
body:
  - type: input
    id: url
    attributes:
      label: Link
      description: The publisher's own address (gov.uk, the council, NHS, Ofsted or WhatDoTheyKnow), not a copy elsewhere.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it shows
      description: The figures you think are useful, with page numbers, and which page of the site they belong on.
    validations:
      required: true
