# From the SEND Sufficiency Plan, based on the council's Capita records for
# January 2025 to around September 2025.
assessments_2025_capita:
  source: sufficiency_plan_2025
  period: January to about September 2025
  rows:
    - { label: "Requests for assessment reviewed", value: "349", page: 24 }
    - { label: "Requests decided within the legal 6 weeks", value: "91%", page: 24 }
    - { label: "Requests where the council agreed to assess", value: "91%", page: 24 }
    - { label: "Requests refused", value: "0%", page: 24 }
    - { label: "Assessments completed", value: "295", page: 24 }
    - { label: "Assessments completed within 16 weeks (the deadline to decide whether to issue a plan)", value: "54%", page: 24 }
    - { label: "Assessments with no decision recorded", value: "26%", page: 25, note: "The plan says this 'needs further investigation to determine why such a high proportion of decisions are not being recorded'." }
    - { label: "New EHC plans issued", value: "375", page: 22 }

tribunal_appeals:
  title: SEND Tribunal appeals against Waltham Forest (council's own count)
  source: sufficiency_plan_2025
  page: 27
  columns: ["2020", "2021", "2022", "2023", "2024"]
  rows:
    - { label: "Appeals", values: [18, 16, 36, 34, 63] }
  note: "In 2024, 27% of appeals were about refusals to assess, 25% about the school or type of placement and 21% about plan contents. Mediation referrals rose from 77 in 2022-23 to 145 in 2023-24 (page 26). The council's legal costs for tribunal cases were £48,860 in 2024, up from £26,197 in 2023, excluding counsel fees."

sufficiency_findings:
  source: sufficiency_plan_2025
  items:
    - { text: "Special schools in Waltham Forest are full (822 pupils). 116 of those places (14%) are taken by children from other boroughs.", page: 58 }
    - { text: "12% of children and young people with EHC plans are placed outside the borough. 2.8% are on home tuition packages, 'mainly because of insufficient specialist provision to meet needs'.", page: 28 }
    - { text: "5.1% of young people with EHC plans are post-16 and not in education, employment or training (no provision).", page: 28 }
    - { text: "Out-of-borough independent and special school placements cost about £60,000 a year on average.", page: 59 }
    - { text: "Without changes, EHC plans are forecast to grow by a further 78-80% by 2030.", page: 21 }

data_quality_warning:
