# Dated, numeric commitments in the improvement plan, and the latest published
# position. `status` is our reading of the latest figure, not the council's RAG.
targets:
  - commitment: SEND Reform Plan - cut projected annual growth in EHC plans from 11.3% to 9.8% from 2027/28, and raise the share of children on SEN support from 12.5% to 14%
    due: From 2027/28
    source: { source: sf_jul2026, page: 178 }
    latest: Plan accepted by the DfE on 2 October 2026. EHC plans grew by 201 (5%) between March and August 2026. The plan's other priority goals (attainment, exclusions and attendance, parental confidence, statutory timeliness) have no published numbers.
    latest_source: { source: sf_oct2026, page: 29 }
    status: no data
  - commitment: Locality-based model to cut the rate of growth in EHC plans by 10% a year
    due: Not stated
    source: { source: sf_dec2024, page: 22 }
    latest: No progress figure published. Plans grew 11.2% in the year to January 2025 and 7.7% to January 2026 (DfE).
    status: no data
  - commitment: Clear the backlog of EHC needs assessments and annual reviews
    due: End of 2025
    source: { source: hwb_oct2025_report, page: 4 }
    latest: In October 2025 the council said the "historic backlog for EHCPs has been cleared". In July 2026 it reported timeliness "remains 12% within 20 weeks".
    latest_source: { source: sf_jul2026, page: 178 }
    status: behind
  - commitment: Health visitor development checks at or above the London average
    due: April 2026
    source: { source: laip_2025, page: 10 }
    latest: 94% of 2-year-olds reviewed by 2.5 years in July 2025, against a London average of 65.4%.
    latest_source: { source: hwb_oct2025_highlight, page: 12 }
    status: met
  - commitment: Short breaks taken up by 10% more children than the 783 currently using them
    due: September 2026
    source: { source: hwb_oct2025_highlight, page: 4 }
    latest: 864 children on 19 September 2025 (target about 861).
    latest_source: { source: hwb_oct2025_highlight, page: 12 }
    status: met
  - commitment: 90% of new EHC plans and annual reviews include documented input from children, young people and families
    due: January 2026
    source: { source: hwb_oct2025_highlight, page: 6 }
    latest: No baseline yet. It will be set from Invision360 audits.
    latest_source: { source: hwb_oct2025_highlight, page: 14 }
    status: no data
  - commitment: 90% of EHCP-related data available within 5 working days of a request
    due: December 2025
    source: { source: hwb_oct2025_highlight, page: 4 }
    latest: No progress figure published.
    status: no data
  - commitment: 100% of SEND staff in all settings complete at least one accredited training module a year
    due: June 2026
    source: { source: hwb_oct2025_highlight, page: 4 }
    latest: Training attendance has been published (2,393 attendees in 2024), but not as a percentage of staff.
    latest_source: { source: hwb_oct2025_highlight, page: 12 }
    status: no data
  - commitment: Publish a graduated response framework, with 100% of schools trained on it
    due: September 2026
    source: { source: hwb_oct2025_highlight, page: 5 }
    latest: Due to go to the SENCO forum "next academic year".
    status: no data
  - commitment: VERBO speech and language programme in 25% of schools by December 2025 and 90% by July 2026
    due: December 2025 and July 2026
    source: { source: hwb_oct2025_highlight, page: 11 }
    latest: 0 schools in August 2025, with 5 schools lined up as early adopters. Delayed by NHS contract signing.
    latest_source: { source: hwb_oct2025_highlight, page: 18 }
    status: behind
  - commitment: 50 children use Spectrum Gaming in its first year
    due: First year
    source: { source: hwb_oct2025_highlight, page: 18 }
    latest: 0 referrals by August 2025.
    latest_source: { source: hwb_oct2025_highlight, page: 18 }
    status: behind
  - commitment: Bring CAMHS waits down from an average of 48 weeks and end waits of more than 52 weeks
    due: Not stated
    source: { source: hwb_oct2025_highlight, page: 18 }
    latest: 39 weeks once on the pathway in August 2025.
    latest_source: { source: hwb_oct2025_highlight, page: 18 }
    status: improving

finance:
  - id: dsg_deficit
    label: Cumulative DSG deficit at 31 March 2026 (outturn)
    value: "£14.32m"
    detail: Up £8.94m in the year. The High Needs Block deficit alone is £19.79m, partly offset by surpluses in the other blocks. (The February 2026 budget had forecast £14.8m.)
    source: sf_jul2026
    page: 10
  - id: hnb_outturn_2526
    label: High Needs overspend 2025/26
    value: "£10.91m"
    detail: Against a planned overspend of £5.76m. The council says this includes a one-off reconciliation of historic payments to schools, as well as growth in EHC plans and alternative provision.
    source: sf_jul2026
    page: 11
  - id: hnb_forecast_2627
    label: Forecast High Needs overspend 2026/27 (at July 2026)
    value: "£13.68m"
    detail: Up £2.63m since the previous forecast, "due to the increasing number of Education & Health Care Plans (EHCP's) in mainstream settings". In March 2026 the budget assumed £10.34m.
    source: sf_oct2026
    page: 29
  - id: stability_grant
    label: High Needs Stability Grant
    value: "£12.89m"
    detail: Confirmed on 2 October 2026 after the DfE accepted the council's SEND Reform Plan. With the grant, the DSG deficit is forecast at £15.12m on 31 March 2027.
    source: sf_oct2026
    page: "30 and 31"
  - id: hnb_allocation
    label: High Needs Block allocation 2026/27 (gross)
    value: "£65.80m"
    detail: Up from £62.38m in 2025/26. The council says this is "solely due to the rolling-in of existing grants", so funding has not risen in real terms.
    source: schools_budget_mar2026
    page: "2 and 8"
  - id: hnb_outturn_2425
    label: High Needs overspend 2024/25
    value: "£3.82m"
    detail: On a £58.5m budget, "mainly due to significant increases in spend across specialist settings, the highest being in INMSS" (independent and non-maintained special schools). SEND transport cost a further £5.25m.
    source: sufficiency_plan_2025
    page: 58
  - id: first_deficit
    label: When the DSG first went into deficit
    value: "March 2021"
    detail: £942,000 net deficit, driven by the High Needs Block.
    source: schools_budget_mar2026
    page: 7
  - id: intervention
    label: DfE intervention programme
    value: "None"
    detail: As of February 2026 the council was not in a DfE intervention programme (Safety Valve or Delivering Better Value). DfE officers were keeping its position under review.
    source: budget_feb2026
    page: 33
  - id: mitigations
    label: Main ways the council plans to bring spending down
    value: "Draft deficit management plan"
    detail: '"reducing the number of requests to assess children whose needs can be met outside the statutory framework; more cost-effective provision being commissioned locally and closer financial management; and improving the workforce capacity."'
    source: budget_feb2026
    page: 34
