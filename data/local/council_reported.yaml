# Figures Waltham Forest Council and its partners have published in committee
# papers. Each observation cites a document in sources.yaml and a page number.
# Values are copied as printed. Where a label in the source is ambiguous it is
# kept verbatim and explained in `note`.
#
# target: the numeric target the council has published for this measure, or
# null where the plan sets a measure and baseline but no target.

measures:

  timeliness_20_weeks:
    title: New EHC plans issued within 20 weeks (council monitoring)
    unit: percent
    plan_ref: Improvement plan measure 3b
    statutory: All plans must be issued within 20 weeks of the request, unless a legal exception applies.
    statutory_source: { source: send_regs_2014, page: "Regulation 13" }
    target: null
    target_note: The improvement plan records a baseline but sets no target or trajectory. It relies on a recovery plan to clear backlogs "by end of 2025".
    target_source: { source: hwb_oct2025_report, page: 4 }
    observations:
      - { period: "Q4 2025", value: 33.81, n: 47, source: laip_2025, page: 15, note: "Labelled 'Q4 2025' in a plan published in April 2025, so probably January to March 2025 (financial-year quarter 4 of 2024/25)." }
      - { period: "March 2025", value: 31.91, n: 15, source: laip_2025, page: 15 }
      - { period: "June 2025", value: 30.58, source: hwb_oct2025_highlight, page: 15 }
      - { period: "August 2025", value: 28, n: 96, source: hwb_oct2025_highlight, page: 15, note: "The council blames delays in educational psychologist advice." }

  annual_reviews_on_time:
    title: Annual reviews completed on time (council monitoring)
    unit: percent
    plan_ref: Improvement plan measure 3c
    statutory: Every EHC plan must be reviewed at least once every 12 months, and the council must give its decision within 4 weeks of the review meeting.
    statutory_source: { source: cfa_2014_s44, page: "Section 44(1); SEND Regulations 2014 reg. 20" }
    target: null
    target_note: No target is set. The council says it is clearing the backlog with temporary staff.
    observations:
      - { period: "Q4 2025", value: 10, n: 23, source: laip_2025, page: 15, note: "Labelled 'Q4 2025' in a plan published in April 2025." }
      - { period: "March 2025", value: 20, n: 12, source: laip_2025, page: 15 }
      - { period: "June 2025", value: 24.18, source: hwb_oct2025_highlight, page: 15 }
      - { period: "August 2025", value: 40.83, n: 1354, source: hwb_oct2025_highlight, page: 15, note: "The same report also gives '58%, N=1941' as a figure 'to date' without saying what period that covers." }

  year9_reviews:
    title: Year 9 annual reviews (preparing for adulthood) completed on time
    unit: percent
    plan_ref: Improvement plan measure 5.01
    statutory: From Year 9, every annual review must cover preparation for adulthood.
    target: null
    target_note: No target is set.
    observations:
      - { period: "March 2025", value: 14, n: 33, source: laip_2025, page: 20, note: "193 Year 9 reviews were late." }
      - { period: "August 2025", value: 12, n: 5, source: hwb_oct2025_highlight, page: 17, note: "156 Year 9 reviews overdue, down from 202 in July 2025." }

  year9_overdue:
    title: Year 9 annual reviews overdue
    unit: count
    lower_is_better: true
    target: null
    observations:
      - { period: "March 2025", value: 193, source: laip_2025, page: 20 }
      - { period: "July 2025", value: 202, source: hwb_oct2025_highlight, page: 17 }
      - { period: "August 2025", value: 156, source: hwb_oct2025_highlight, page: 17 }

  complaints:
    title: SEND complaints received per month
    unit: count
    lower_is_better: true
    plan_ref: Improvement plan measure 2.08 ("Fewer complaints received")
    target: null
    observations:
      - { period: "March 2025", value: 60, source: hwb_oct2025_highlight, page: 14 }
      - { period: "July 2025", value: 40, source: hwb_oct2025_highlight, page: 14 }
      - { period: "August 2025", value: 25, source: hwb_oct2025_highlight, page: 14 }

  ehcp_audit_quality:
    title: EHC plans graded "good" in quality audits
    unit: percent
    plan_ref: Improvement plan measure 3a
    target: null
    target_note: No audits were done between December 2024 and August 2025. There is no benchmark for annual reviews.
    observations:
      - { period: "December 2024", value: 82.3, source: hwb_oct2025_highlight, page: 15, note: "The improvement plan dates this baseline 'December 2025'. The later highlight report says December 2024." }

backlogs:
  - { label: "EHC needs assessments outstanding", value: 230, period: "November 2024", source: hwb_oct2025_report, page: 2 }
  - { label: "Annual reviews outstanding", value: 1637, period: "November 2024", source: hwb_oct2025_report, page: 2 }
  - { label: "Share of SEND education placements outside the borough", value: "17%", period: "November 2024", source: hwb_oct2025_report, page: 2 }
  - { label: "Children placed out of borough this year (28 the year before)", value: 5, period: "October 2025", source: hwb_oct2025_report, page: 3 }
  - { label: "Permanent staff in the SEND establishment", value: "70%", period: "October 2025", source: hwb_oct2025_report, page: 3 }
  - { label: "Health advice for assessments returned within 6 weeks", value: "65-90%", period: "October 2025", source: hwb_oct2025_report, page: 4, note: "The statutory deadline for health advice is 6 weeks (SEND Regulations 2014, reg. 8)." }

data_quality_warning:
