# Department for Education datasets pulled by scripts/fetch_dfe.py.
#
# Every dataset comes from Explore Education Statistics (EES), the DfE's official
# statistics service. Two kinds of identifier are used:
#
#   api_id   - an EES *API* data set. Stable across releases: the fetcher asks the
#              API for the latest version, so new releases are picked up
#              automatically.
#   file_id  - a data catalogue file id for data sets that are not (yet) in the
#              API. These change when DfE publishes a new release, so check them
#              once a year (see README "Updating the data").
#
# `keep` restricts rows to the breakdowns the site uses, to keep the committed
# CSVs small. Rows are always limited to England, London, the London boroughs
# and Waltham Forest's statistical neighbours (listed below).

# The 10 councils most like Waltham Forest, from the DfE's Children's services
# statistical neighbour benchmarking tool (ModelLong sheet). The site compares
# Waltham Forest with their average, as the DfE's own LAIT tool does. Check
# the tool once a year; the model was last rebuilt in May 2025.
statistical_neighbours:
  title: Children's services statistical neighbour benchmarking tool
  publisher: Department for Education
  version: v1, May 2025
  url: https://www.gov.uk/government/publications/local-authority-interactive-tool-lait
  download_url: https://assets.publishing.service.gov.uk/media/682dd813e9440506ee95390e/Children_s_services_statistical_neighbour_benchmarking_tool.xlsx
  areas:  # closest first
    - {code: E09000026, name: Redbridge, region: London}
    - {code: E09000003, name: Barnet, region: London}
    - {code: E09000017, name: Hillingdon, region: London}
    - {code: E09000008, name: Croydon, region: London}
    - {code: E09000009, name: Ealing, region: London}
    - {code: E09000014, name: Haringey, region: London}
    - {code: E09000018, name: Hounslow, region: London}
    - {code: E09000015, name: Harrow, region: London}
    - {code: E09000023, name: Lewisham, region: London}
    - {code: E06000045, name: Southampton, region: South East}

