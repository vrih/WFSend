# Department for Education datasets pulled by scripts/fetch_dfe.py.
#
# Every dataset comes from Explore Education Statistics (EES), the DfE's official
# statistics service. Two kinds of identifier are used:
#
#   api_id   - an EES *API* data set. Stable across releases: the fetcher asks the
#              API for the latest version, so new releases are picked up
#              automatically.
#   file_id  - a data catalogue file id for data sets that are not (yet) in the
#              API. These change when DfE publishes a new release, so check them
#              once a year (see README "Updating the data").
#
# `keep` restricts rows to the breakdowns the site uses, to keep the committed
# CSVs small. Rows are always limited to England, London and the London boroughs.

publications:
  ehcp:
    title: Education, health and care plans
    publisher: Department for Education
    url: https://explore-education-statistics.service.gov.uk/find-statistics/education-health-and-care-plans
  sen:
    title: Special educational needs in England
    publisher: Department for Education
    url: https://explore-education-statistics.service.gov.uk/find-statistics/special-educational-needs-in-england
  ks2:
    title: Key stage 2 attainment
    publisher: Department for Education
    url: https://explore-education-statistics.service.gov.uk/find-statistics/key-stage-2-attainment
  ks4:
    title: Key stage 4 performance
    publisher: Department for Education
    url: https://explore-education-statistics.service.gov.uk/find-statistics/key-stage-4-performance
  expenditure:
    title: LA and school expenditure
    publisher: Department for Education
    url: https://explore-education-statistics.service.gov.uk/find-statistics/la-and-school-expenditure
  absence:
    title: Pupil absence in schools in England
    publisher: Department for Education
    url: https://explore-education-statistics.service.gov.uk/find-statistics/pupil-absence-in-schools-in-england
  eyfs:
    title: Early years foundation stage profile results
    publisher: Department for Education
    url: https://explore-education-statistics.service.gov.uk/find-statistics/early-years-foundation-stage-profile-results
  ks4_destinations:
    title: Key stage 4 destination measures
    publisher: Department for Education
    url: https://explore-education-statistics.service.gov.uk/find-statistics/key-stage-4-destination-measures
  neet:
    title: Participation in education, training and NEET age 16 to 17 by local authority
    publisher: Department for Education
    url: https://explore-education-statistics.service.gov.uk/find-statistics/participation-in-education-training-and-neet-age-16-to-17-by-local-authority
  exclusions:
    title: Suspensions and permanent exclusions in England
    publisher: Department for Education
    url: https://explore-education-statistics.service.gov.uk/find-statistics/suspensions-and-permanent-exclusions-in-england

datasets:
  ehcp_caseload:
    publication: ehcp
    api_id: 01a0aa37-1008-7183-9271-35e3bcbb26c8
    keep:
      breakdown_topic: [All EHC plans]

  ehcp_requests:
    publication: ehcp
    api_id: 01a0aa36-eb22-7682-94aa-a6bcbb1117ae
    keep:
      breakdown_topic: [All requests for EHC needs assessments]
      request_source: [Total]

  ehcp_timeliness:
    publication: ehcp
    api_id: 01a0aa36-b680-76f8-8e62-55b216223feb
    keep:
      breakdown_topic: [All EHC plans, All EHC plans issued]  # label changed in 2023

  ehcp_new_plans:
    publication: ehcp
    api_id: 01a0aa36-6b29-70e3-8f29-5d5b9aeeea9b
    keep:
      breakdown_topic: [All new EHC plans]

  ehcp_assessments:
    publication: ehcp
    file_id: 866331e6-4be2-4242-985a-c00c7ac274b5
    title: Assessments for an education, health and care plan carried out during the calendar year
    keep:
      breakdown_topic: [All EHC needs assessments]

  ehcp_annual_reviews:
    publication: ehcp
    file_id: 49159ef4-a116-47d7-9e16-61feb9981089
    title: Number of annual reviews of EHC plans
    keep:
      breakdown_topic: [All reviews of EHC plans]

  sen_pupils:
    publication: sen
    file_id: 730c131b-6383-443d-ae53-880a69799f11
    title: Pupils in all schools, by type of SEN provision - 2016 to 2026
    keep:
      phase_type_grouping: [Total]
      establishment_type: [Total]
      hospital_school: [Total]
    # This file also has parliamentary constituency rows; those are dropped.

  ks2_attainment:
    publication: ks2
    file_id: 33799174-6834-4433-b0d0-a0e602ea90b7
    title: Attainment by region, local authority and pupil characteristics
    keep:
      subject: [Reading, writing and maths]
      sex: [Total]
      disadvantage_status: [Total]
      fsm_status: [Total]
      ethnicity_major: [Total]
      ethnicity_minor: [Total]
      first_language: [Total]
      establishment_type_group: [All state funded]

  ks4_sen:
    publication: ks4
    api_id: 19e39901-560d-f972-b6f3-dd085539c095  # "National characteristics summary data" (has LA level)
    keep:
      establishment_type_group: [All state-funded]
      breakdown_topic: [Total, SEN provision]

  exclusions_characteristics:
    publication: exclusions
    file_id: ae917392-59b2-4d62-b898-c8286adbc02e
    title: Suspensions and permanent exclusions - by characteristic
    keep:
      education_phase: [Total]
      characteristic_group: [SEN provision, Total]

  s251_outturn:
    publication: expenditure
    file_id: 61de56b6-878c-4858-916b-f67a0cf9337d
    title: LA expenditure on schools, other education and community - unrounded data
    encoding: cp1252
    keep:
      category_of_expenditure:
        - "1.2.1 Top-up funding – maintained schools"
        - "1.2.2 Top-up funding – academies, free schools and colleges"
        - "1.2.3 Top-up and other funding – non-maintained and independent providers"
        - "2.1.1 Educational psychology service"
        - "2.1.2 SEN administration, assessment and coordination and monitoring"
        - "2.1.4 Home to school transport (pre 16): SEN transport expenditure"
        - "2.1.6 Home to post-16 provision: SEN/ LLDD transport expenditure (aged 16-18)"
        - "2.1.7 Home to post-16 provision: SEN/ LLDD transport expenditure (aged 19-25)"

  absence_sen:
    publication: absence
    file_id: be7980d7-70b8-441d-9ae9-c181f89c3813
    title: Absence by pupil characteristics - autumn and spring terms combined
    keep:
      education_phase: [Total]
      characteristic: [Total, SEN provision]

  eyfs_sen:
    publication: eyfs
    file_id: 853bf1b8-799c-4921-8b87-1d2bee0f3c22
    title: Headline measures by child characteristics
    keep:
      breakdown_topic: [Total, SEN provision]
      sex: [Total]

  ks4_destinations_sen:
    publication: ks4_destinations
    file_id: 08ef3846-2514-4b7c-a85f-6df089099641
    title: Key stage 4 destination measures
    keep:
      breakdown_topic: [Total, SEN provision]
      establishment_type_group: [State-funded mainstream and special, Total state-funded mainstream and special]  # LA vs national label
      establishment_type: [Total]
      sex: [Total]
      ethnicity_major: [Total]
      disadvantage_status: [Total]
      destination_group: [Overall destination]

  neet_sen:
    publication: neet
    file_id: a7bc111a-9503-40df-99fa-764fcb13a2e9
    title: NEET by characteristics
    keep:
      characteristic_grouping: [Total, SEND]

# The SEND Tribunal appeal rate by local authority is published by DfE as a
